<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Front Yard Famous creates modern yard greetings, storks, and celebration displays for birthdays, new babies, graduations, retirements, and more."
    />
    <!--
      Front Yard Famous is a fictional business and this is a demonstration
      site. It is here to be linked from goodlookingdigital.com, not to be found
      by someone searching for a yard greeting company, who would arrive, read
      half a page and try to book a date nobody can honour.

      Crawling stays allowed on purpose. A crawler has to fetch the page to read
      the tag below, so disallowing in robots.txt would hide it and the address
      could still be indexed from a link elsewhere, with no description and no
      way to correct it.

      The tag comes off if this site is ever sold to a real business.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#123526" />
    <meta property="og:site_name" content="Front Yard Famous" />
    <meta property="og:title" content="Front Yard Famous | Modern Yard Greetings" />
    <meta
      property="og:description"
      content="Stylish yard sign setups for birthdays, new babies, graduations, anniversaries, retirements, and custom celebrations."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://frontyardfamous.com/" />
    <meta property="og:image" content="https://frontyardfamous.com/images/hero-birthday-display.png" />
    <meta
      property="og:image:alt"
      content="Premium happy birthday yard display with large letters and bright graphic accents"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Front Yard Famous | Modern Yard Greetings" />
    <meta
      name="twitter:description"
      content="Modern yard greetings, storks, milestone numbers, and custom celebration displays."
    />
    <meta name="twitter:image" content="https://frontyardfamous.com/images/hero-birthday-display.png" />
    <link rel="canonical" href="https://frontyardfamous.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Front Yard Famous | Modern Yard Greetings</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
